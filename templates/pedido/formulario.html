{% extends 'base.html' %}

{% block titulo_conteudo %} {{ titulo|default:"Cadastro de Pedido" }} {% endblock %}

{% block conteudo %}  
  
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    
    <div class="mt-4">
        {% if not apenas_leitura %}
            <button type="submit" class="btn btn-primary me-2">Salvar</button>
        {% endif %}
        <a href="{% url 'pedido' %}" class="btn btn-secondary">Voltar</a>
    </div>

</form>
{% endblock %}
